services:
  whatsapp-api-1:
    build: .
    container_name: whatsapp-api-1
    ports:
      - "4600:3000"
    volumes:
      - whatsapp_data_1:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  whatsapp-api-2:
    build: .
    container_name: whatsapp-api-2
    ports:
      - "4601:3000"
    volumes:
      - whatsapp_data_2:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  whatsapp-api-3:
    build: .
    container_name: whatsapp-api-3
    ports:
      - "4602:3000"
    volumes:
      - whatsapp_data_3:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

volumes:
  whatsapp_data_1:
  whatsapp_data_2:
  whatsapp_data_3:
